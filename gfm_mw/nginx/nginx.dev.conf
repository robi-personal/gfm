upstream app {
    server app:3000;
}

upstream admin {
    server admin:5173;
}

server {
    listen 80;
    server_name _;

    # Matches Express body-parser limit. Oversized requests rejected here
    # before reaching Node. See rate-limiting-abuse.md §5.1.
    client_max_body_size    8m;
    client_body_buffer_size 128k;
    client_body_timeout     30s;

    # Real client IP — trust the Docker bridge network.
    # Express reads req.ip from X-Forwarded-For set here.
    # See rate-limiting-abuse.md §4.4.
    set_real_ip_from  172.0.0.0/8;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    location /admin {
        proxy_pass         http://admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";
        # Vite WebSocket for HMR
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass         http://app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Connection        "";

        # YouTube requests allow up to 180s; set nginx above that so the app
        # always sends its own error before nginx cuts with a 504.
        proxy_read_timeout 185s;
        proxy_send_timeout 185s;
    }
}
