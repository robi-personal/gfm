# Production Nginx config — TLS termination, real IP, body limits.
# See rate-limiting-abuse.md §3 (defence layers) and §4.4 (IP detection).
#
# Assumption: Let's Encrypt certs managed by Certbot at the standard paths.
# Run: certbot --nginx -d api.<your-domain>.com
# Certbot will extend this file with the ssl_certificate directives.
# The blocks below are the base config Certbot builds on.

upstream gfm_app {
    server app:3000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.YOURDOMAIN.com;

    # Let's Encrypt ACME challenge (needed during cert renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.YOURDOMAIN.com;

    # Certbot populates these two directives after first issuance.
    # Do not edit manually; certbot manages them.
    ssl_certificate     /etc/letsencrypt/live/api.YOURDOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.YOURDOMAIN.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;

    # ── Body limits (rate-limiting-abuse.md §5.1) ─────────────────────────────
    # Matches Express 8mb limit. Oversized bodies are rejected at Nginx before
    # reaching Node, saving event-loop time.
    client_max_body_size    8m;
    client_body_buffer_size 128k;
    client_body_timeout     30s;

    # ── Real client IP (rate-limiting-abuse.md §4.4) ─────────────────────────
    # Adjust set_real_ip_from if Cloudflare or another CDN sits in front.
    # For direct-to-VPS: trust only the Docker bridge (no upstream proxy).
    # For Cloudflare: add the Cloudflare IP ranges instead.
    set_real_ip_from  127.0.0.1;
    set_real_ip_from  10.0.0.0/8;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    location / {
        proxy_pass         http://gfm_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Slightly above the 30s Gemini timeout — lets the app send its own 503
        # before Nginx cuts the connection with a 504 (rate-limiting-abuse.md §3).
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;

        proxy_buffering    off;
    }

    # ── Certbot webroot for renewals ─────────────────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
